default_language_version:
    python: python3.13
default_stages: [pre-commit]
repos:
    - repo: local
      hooks:
          - id: pytest-check
            name: pytest-check
            entry: uv run pytest
            language: system
            # stages: [push]
            types: [python]
            pass_filenames: false
            always_run: true
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v5.0.0
      hooks:
          # - id: trailing-whitespace
          # - id: check-ast
          - id: check-case-conflict
          - id: check-docstring-first
          - id: check-merge-conflict
          # - id: check-yaml
          - id: check-toml
          - id: check-json
          - id: detect-private-key
          - id: forbid-new-submodules
          # - id: check-added-large-files
    # https://pre-commit.com/hooks.html

    - repo: local
      hooks:
          - id: mypy
            name: mypy
            entry: uv run mypy mkdocs_mknodes/
            language: system
            types: [python]
            pass_filenames: false
            require_serial: true

    - repo: local
      hooks:
          - id: ruff
            name: ruff
            entry: uv run ruff check
            language: system
            types: [python]
            require_serial: true
          - id: ruff-format
            name: ruff-format
            entry: uv run ruff format
            language: system
            types: [python]
            require_serial: true

    - repo: https://github.com/commitizen-tools/commitizen
      rev: v3.30.0
      hooks:
          - id: commitizen
            stages: [commit-msg]
            additional_dependencies: [typing-extensions]
